<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Metro Founder</title><style>
:root{--bg:#111827;--panel:#182235;--line:#34445d;--text:#edf3ff;--muted:#a8b5ca;--green:#72df9b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif;touch-action:none}button{font:inherit;color:var(--text);background:#293952;border:1px solid #465b78;border-radius:10px;padding:9px;cursor:pointer}button.active{background:#236345;border-color:#61d995}#app{height:100dvh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:8px;padding:10px;background:#0c1320;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--green)}.stats{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}.stats b{color:white}#game{position:relative;flex:1;min-height:0;background:#9eb7a0}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;left:9px;top:9px;background:#111827e8;border:1px solid #43536a;border-radius:11px;padding:9px;font-size:11px;line-height:1.5;pointer-events:none}.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0d1728f2;border:1px solid #5a718e;padding:9px 12px;border-radius:12px;max-width:90%;text-align:center;z-index:2;display:none}.bottom{background:#111827;border-top:1px solid var(--line);padding:7px}.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.tools button{padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:49px}.ico{font-size:18px}.subtools{display:flex;gap:6px;overflow-x:auto;padding-top:7px}.subtools button{white-space:nowrap;font-size:11px}.tip{font-size:10px;color:var(--muted);padding:5px 2px 0}.modalbg{position:absolute;inset:0;background:#050a12b8;z-index:8;display:none;align-items:center;justify-content:center;padding:16px}.modal{width:min(440px,100%);max-height:85%;overflow:auto;background:#182235;border:1px solid #455b78;border-radius:16px;padding:16px}.modal h2{margin:0 0 8px}.modal p,.mission small{color:var(--muted);line-height:1.45}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.missions{display:grid;gap:8px}.mission{background:#202e45;border:1px solid #34445d;padding:10px;border-radius:10px}.mission small{display:block;margin-top:3px}.mission.done{border-color:#4da977}.row{display:flex;justify-content:space-between;gap:8px}.good{color:var(--green)}@media(min-width:800px){.top{padding:12px 20px}.bottom{padding:10px 16px}.tools{grid-template-columns:repeat(8,minmax(0,1fr))}.tools button{flex-direction:row;justify-content:center;min-height:42px}.hud{font-size:13px}}
</style></head><body><div id="app"><header class="top"><div class="brand">METRO <span>FOUNDER</span></div><div class="stats"><span>💰 <b id="money">$25,000</b></span><span>👥 <b id="pop">0</b></span><span>🙂 <b id="happy">65%</b></span><span>📅 <b id="day">Day 1</b></span></div></header><main id="game"><canvas id="world"></canvas><div class="hud" id="hud"><b style="color:#72df9b">New Mayor</b><br>Build a road, then zone beside it.<br>Complete missions to earn funds.</div><div class="toast" id="toast"></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div></main><footer class="bottom"><div class="tools"><button data-tool="inspect" class="active"><span class="ico">👆</span>Inspect</button><button data-tool="road"><span class="ico">🛣️</span>Road</button><button data-tool="res"><span class="ico">🏠</span>Residential</button><button data-tool="com"><span class="ico">🏪</span>Commercial</button><button data-tool="ind"><span class="ico">🏭</span>Industry</button><button data-tool="park"><span class="ico">🌳</span>Park</button><button data-tool="bulldoze"><span class="ico">🧹</span>Bulldoze</button><button data-tool="city"><span class="ico">🏙️</span>City Hall</button></div><div class="subtools"><button id="missionsBtn">📋 Missions</button><button id="saveBtn">💾 Save</button><button id="loadBtn">↩️ Load</button><button id="zoomOut">− Zoom</button><button id="zoomIn">+ Zoom</button><button id="resetView">Center</button><button id="helpBtn">Help</button></div><div class="tip" id="tip">Tap a tile to inspect. Choose Road and drag across tiles to build a road.</div></footer></div>
<script>(()=>{const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),N=32,T=30;let money=25000,pop=0,happy=65,day=1,tool='inspect',camX=0,camY=20,zoom=1,tiles=[],buildings=[],roads=new Set(),parks=new Set(),selected=null,drag=null,pointer=null,pan=false,tick=0,claimed=[];const costs={road:180,res:350,com:500,ind:650,park:700},key=(x,y)=>x+','+y,labels={inspect:'Inspect',road:'Road',res:'Residential',com:'Commercial',ind:'Industry',park:'Park',bulldoze:'Bulldoze',city:'City Hall'};for(let y=0;y<N;y++)for(let x=0;x<N;x++)tiles.push({x,y});
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}function iso(x,y){return{x:(x-y)*T*zoom+camX,y:(x+y)*T*.5*zoom+camY}}function toGrid(sx,sy){let x=sx-camX,y=sy-camY,tw=T*zoom,th=T*.5*zoom;return{x:Math.floor((x/tw+y/th)/2),y:Math.floor((y/th-x/tw)/2)}}function poly(p,fill,stroke){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function pts(x,y){let p=iso(x,y),w=T*zoom,h=T*.5*zoom;return[{x:p.x,y:p.y},{x:p.x+w,y:p.y+h},{x:p.x,y:p.y+2*h},{x:p.x-w,y:p.y+h}]}function drawTile(t){let p=pts(t.x,t.y),k=key(t.x,t.y),b=buildings.find(q=>q.x===t.x&&q.y===t.y),road=roads.has(k),park=parks.has(k);poly(p,road?'#777e84':park?'#78ad7a':b?(b.type==='res'?'#c4d5e7':b.type==='com'?'#e7cb8a':'#c2a18c'):((t.x+t.y)%2?'#a2bda0':'#aac4a7'),'#819a83');if(road){ctx.strokeStyle='#e4e1d4';ctx.lineWidth=Math.max(1,2*zoom);ctx.setLineDash([5*zoom,5*zoom]);ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[2].x,p[2].y);ctx.moveTo(p[1].x,p[1].y);ctx.lineTo(p[3].x,p[3].y);ctx.stroke();ctx.setLineDash([])}if(park){let q=iso(t.x,t.y);ctx.fillStyle='#397c4d';ctx.beginPath();ctx.arc(q.x,q.y+T*.48*zoom,5*zoom,0,7);ctx.fill();ctx.fillRect(q.x-1,q.y+T*.48*zoom,3*zoom,7*zoom)}if(b){let q=iso(t.x,t.y),w=T*.62*zoom,h=T*.48*zoom,ht=b.level*7*zoom,bx=q.x-w/2,by=q.y+T*.48*zoom-ht,roof=b.type==='res'?'#b5c9d9':b.type==='com'?'#e4b75f':'#b68e77',side=b.type==='res'?'#718ba5':b.type==='com'?'#b98839':'#8e6d5d';poly([{x:bx,y:by},{x:bx+w/2,y:by-h*.35},{x:bx+w,y:by},{x:bx+w/2,y:by+h*.35}],roof,'#66788b');poly([{x:bx,y:by},{x:bx+w/2,y:by+h*.35},{x:bx+w/2,y:by+h*.35+ht},{x:bx,y:by+ht}],side,'#66788b');poly([{x:bx+w/2,y:by+h*.35},{x:bx+w,y:by},{x:bx+w,y:by+ht},{x:bx+w/2,y:by+h*.35+ht}],roof,'#66788b');ctx.fillStyle='#fff0a5';ctx.fillRect(bx+w*.25,by+ht*.5,3*zoom,4*zoom)}if(selected&&selected.x===t.x&&selected.y===t.y)poly(p,'#fff36b22','#fff36b')}function draw(){let r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#9eb7a0';ctx.fillRect(0,0,r.width,r.height);[...tiles].sort((a,b)=>a.x+a.y-b.x-b.y).forEach(drawTile)}function status(){ $('money').textContent='$'+Math.floor(money).toLocaleString();$('pop').textContent=pop.toLocaleString();$('happy').textContent=happy+'%';$('day').textContent='Day '+day;let count=t=>buildings.filter(b=>b.type===t).length;$('hud').innerHTML=`<b style="color:#72df9b">${day===1?'New Mayor':'Mayor Level '+Math.min(10,1+Math.floor(day/5))}</b><br>🏠 Homes: ${count('res')} · 🏪 Shops: ${count('com')}<br>🏭 Industry: ${count('ind')} · 🌳 Parks: ${parks.size}<br><span style="color:#d2dce9">Roads connect tiles; zones need road access.</span>`}function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.style.display='none',2200)}function roadAccess(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>roads.has(key(x+a,y+b)))}function occupied(x,y){return buildings.some(b=>b.x===x&&b.y===y)||roads.has(key(x,y))||parks.has(key(x,y))}function act(x,y){if(x<0||y<0||x>=N||y>=N)return;selected={x,y};let k=key(x,y),b=buildings.find(q=>q.x===x&&q.y===y);if(tool==='inspect'){if(b)buildingModal(b);else toast(roads.has(k)?'Road tile':parks.has(k)?'Park tile':'Empty land');draw();return}if(tool==='road'){if(occupied(x,y)&&!roads.has(k)){toast('Tile occupied');return}if(!roads.has(k)){if(money<costs.road){toast('Not enough money');return}roads.add(k);money-=costs.road;toast('Road built · −$180')}}else if(tool==='bulldoze'){if(b){buildings=buildings.filter(q=>q!==b);money+=Math.floor(costs[b.type]*.25)}else if(roads.delete(k))money+=45;else if(parks.delete(k))money+=175;else toast('Nothing to remove')}else if(tool==='park'){if(occupied(x,y)){toast('Tile occupied');return}if(money<costs.park){toast('Not enough money');return}parks.add(k);money-=costs.park;happy=Math.min(100,happy+3);toast('Park opened · happiness +3%')}else if(['res','com','ind'].includes(tool)){if(occupied(x,y)){toast('Tile occupied');return}if(!roadAccess(x,y)){toast('Build a road next to this tile first');return}if(money<costs[tool]){toast('Not enough money');return}buildings.push({x,y,type:tool,level:1,age:0});money-=costs[tool];toast(labels[tool]+' developed')}status();draw();save(false)}function modal(html){$('modal').innerHTML=html;$('modalbg').style.display='flex'}function close(){ $('modalbg').style.display='none'}function buildingModal(b){let n={res:'Residential',com:'Commercial',ind:'Industrial'}[b.type];modal(`<h2>${n} building</h2><p>Level ${b.level} · Age ${b.age} days</p><p>Buildings grow over time and generate city activity.</p><div class="actions"><button id="upgrade">Upgrade ($${Math.floor(costs[b.type]*.8).toLocaleString()})</button><button id="close">Close</button></div>`);$('upgrade').onclick=()=>{let cost=Math.floor(costs[b.type]*.8);if(money<cost){toast('Not enough money');return}money-=cost;b.level++;close();status();draw();save(false);toast('Building upgraded')};$('close').onclick=close}const missions=[{id:'r',title:'Connect the neighbourhood',desc:'Build at least 3 road tiles.',goal:()=>roads.size>=3,reward:2500},{id:'h',title:'First residents',desc:'Build 3 residential buildings.',goal:()=>buildings.filter(b=>b.type==='res').length>=3,reward:3500},{id:'s',title:'Local business',desc:'Build 1 commercial building.',goal:()=>buildings.some(b=>b.type==='com'),reward:2500},{id:'i',title:'Jobs for citizens',desc:'Build 1 industrial building.',goal:()=>buildings.some(b=>b.type==='ind'),reward:3000},{id:'p',title:'Green city',desc:'Build 1 park.',goal:()=>parks.size>=1,reward:2000}];function missionsModal(){modal(`<h2>Career missions</h2><p>Complete objectives and claim cash rewards.</p><div class="missions">${missions.map(m=>{let done=m.goal(),got=claimed.includes(m.id);return `<div class="mission ${done?'done':''}"><div class="row"><b>${m.title}</b><b>${got?'✓ Claimed':done?'✓ Complete':'$'+m.reward.toLocaleString()}</b></div><small>${m.desc}</small>${done&&!got?`<button data-claim="${m.id}" style="width:100%;margin-top:7px">Claim $${m.reward.toLocaleString()}</button>`:''}</div>`}).join('')}</div><div class="actions"><button id="close">Close</button></div>`);document.querySelectorAll('[data-claim]').forEach(btn=>btn.onclick=()=>{let m=missions.find(m=>m.id===btn.dataset.claim);if(!claimed.includes(m.id)&&m.goal()){claimed.push(m.id);money+=m.reward;status();save(false);missionsModal();toast('Mission reward +$'+m.reward.toLocaleString())}});$('close').onclick=close}function cityModal(){let count=t=>buildings.filter(b=>b.type===t).length;modal(`<h2>City Hall</h2><div class="missions"><div class="mission">Population <b>${pop}</b></div><div class="mission">Treasury <b>$${money.toLocaleString()}</b></div><div class="mission">Happiness <b>${happy}%</b></div><div class="mission">Road tiles <b>${roads.size}</b></div></div><div class="actions"><button id="m">Career missions</button><button id="close">Close</button></div>`);$('m').onclick=missionsModal;$('close').onclick=close}function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('tip').textContent=({inspect:'Tap a building to upgrade. Drag empty space to pan.',road:'Tap or drag to build roads ($180/tile).',res:'Place homes beside roads ($350).',com:'Place shops beside roads ($500).',ind:'Place industry beside roads ($650).',park:'Parks cost $700 and improve happiness.',bulldoze:'Tap a building, road or park to remove it.',city:'City Hall overview and career missions.'})[t];if(t==='city')cityModal()}function save(show=true){try{localStorage.setItem('metro_founder_save',JSON.stringify({money,pop,happy,day,buildings,roads:[...roads],parks:[...parks],claimed,camX,camY,zoom}));if(show)toast('City saved on this device')}catch(e){toast('Save failed')}}function load(){try{let d=JSON.parse(localStorage.getItem('metro_founder_save')||'null');if(!d){toast('No saved city found');return}money=d.money;pop=d.pop;happy=d.happy;day=d.day;buildings=d.buildings||[];roads=new Set(d.roads||[]);parks=new Set(d.parks||[]);claimed=d.claimed||[];camX=d.camX;camY=d.camY;zoom=d.zoom;status();draw();toast('City loaded')}catch(e){toast('Could not load save')}}function step(){if(++tick%15)return;day++;let res=buildings.filter(b=>b.type==='res').length,com=buildings.filter(b=>b.type==='com').length,ind=buildings.filter(b=>b.type==='ind').length;pop=res*12+buildings.reduce((a,b)=>a+(b.level-1)*4,0);let income=res*24+com*55+ind*70;money+=income;happy=Math.max(15,Math.min(100,65+parks.size*3-Math.max(0,buildings.length-parks.size*4)));buildings.forEach(b=>{b.age++;if(b.age%4===0&&b.level<5&&roadAccess(b.x,b.y))b.level++});status();toast(`Day ${day}: taxes +$${income.toLocaleString()}`);save(false);draw()}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('missionsBtn').onclick=missionsModal;$('saveBtn').onclick=()=>save(true);$('loadBtn').onclick=load;$('zoomIn').onclick=()=>{zoom=Math.min(1.8,zoom+.1);draw()};$('zoomOut').onclick=()=>{zoom=Math.max(.45,zoom-.1);draw()};$('resetView').onclick=()=>{let r=c.getBoundingClientRect();camX=r.width/2;camY=20;draw()};$('helpBtn').onclick=()=>{modal('<h2>How to play</h2><p>1. Select Road and tap/drag to build roads.</p><p>2. Place homes, shops and industry beside roads.</p><p>3. Collect taxes every 15 seconds (one game day). Upgrade buildings in Inspect mode.</p><p>4. Complete Career missions for bonus funds. Save your city on this device.</p><p>On iPhone, drag empty space in Inspect mode to pan and pinch with two fingers to zoom.</p><div class="actions"><button id="close">Got it</button></div>');$('close').onclick=close};$('modalbg').onclick=e=>{if(e.target===$('modalbg'))close()};
let pointers=new Map(),pinch=null,start=null,dragStart=null; c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};pointer=p;start={x:e.clientX,y:e.clientY,camX,camY};if(pointers.size===2){let a=[...pointers.values()];pinch={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom};dragStart=null;pan=true;return}if(tool==='road'){dragStart=toGrid(p.x,p.y);act(dragStart.x,dragStart.y)}else if(tool==='inspect'){dragStart={screenX:p.x,screenY:p.y,grid:toGrid(p.x,p.y)};pan=false}else act(...[toGrid(p.x,p.y).x,toGrid(p.x,p.y).y])});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};pointer=p;if(pointers.size>=2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch){zoom=Math.max(.45,Math.min(1.8,pinch.zoom*d/pinch.dist));camX=(a[0].x+a[1].x)/2-r.left;camY=(a[0].y+a[1].y)/2-r.top}draw();return}if(tool==='inspect'&&dragStart&&start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>6){camX=start.camX+e.clientX-start.x;camY=start.camY+e.clientY-start.y;pan=true}draw()});c.addEventListener('pointerup',e=>{let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};if(pointers.size===1&&tool==='road'&&dragStart){let end=toGrid(p.x,p.y),x=dragStart.x,y=dragStart.y,dx=end.x-x,dy=end.y-y,steps=Math.max(Math.abs(dx),Math.abs(dy),1);for(let i=1;i<=Math.min(steps,N*2);i++){let nx=Math.round(x+dx*i/steps),ny=Math.round(y+dy*i/steps),k=key(nx,ny);if(nx>=0&&ny>=0&&nx<N&&ny<N&&!occupied(nx,ny)&&money>=costs.road){roads.add(k);money-=costs.road}}status();save(false)}if(tool==='inspect'&&!pan&&dragStart?.grid)act(dragStart.grid.x,dragStart.grid.y);pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size){dragStart=null;start=null;pan=false}draw()});c.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);dragStart=null;start=null;pinch=null;draw()});window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)save(false)});resize();camX=c.getBoundingClientRect().width/2;status();draw();setInterval(step,1000);if(localStorage.getItem('metro_founder_save'))toast('Welcome back! Load your saved city.');else toast('Welcome Mayor! Build your first road.');})();
</script></body></html>
